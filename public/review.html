<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <title>Crazy 88 · Jury</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="row">
        <div class="grow">
          <div class="title">Jury</div>
          <div class="small muted"><span id="phase"></span> <span class="timer" id="timer"></span></div>
        </div>
        <div class="small muted" style="text-align:right">
          <div><b id="pending">0</b> wachtend</div>
          <div><b id="done">0</b> door jou beoordeeld</div>
        </div>
        <a class="btn secondary small hidden" id="admin-link" href="/admin">Beheer</a>
        <button class="secondary small" id="logout">Uitloggen</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="review-stage" id="stage"></div>
    <div class="review-actions" id="actions">
      <button class="no" id="btn-no" aria-label="Afkeuren">✗</button>
      <button class="yes" id="btn-yes" aria-label="Goedkeuren">✓</button>
    </div>
    <p class="small muted" style="text-align:center">Swipe naar rechts of druk op → om goed te keuren. Swipe naar links of druk op ← om af te keuren.</p>
  </main>

  <dialog id="reason-dialog" class="card reason-dialog">
    <form method="dialog">
      <h3>Afkeuren</h3>
      <label for="reason">Reden (optioneel, het team ziet deze)</label>
      <input id="reason" maxlength="200" autocomplete="off" placeholder="Bijv. foto is onscherp">
      <div class="row" id="reason-presets" style="margin-top:10px">
        <button type="button" class="secondary small">Past niet bij de prompt</button>
        <button type="button" class="secondary small">Niet het hele team</button>
        <button type="button" class="secondary small">Foto is onduidelijk</button>
      </div>
      <div class="row" style="margin-top:16px">
        <button type="button" class="secondary grow" id="reason-cancel">Annuleren</button>
        <button value="reject" class="danger grow" id="reason-reject">Afkeuren</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/review.js"></script>
</body>
</html>
